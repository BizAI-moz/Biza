<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BizAI — Assistente de Negócios</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#111827;color:white;padding:22px 18px;text-align:center}
header h1{margin:0 0 6px;font-size:30px}header p{margin:0;color:#cbd5e1}
main{max-width:760px;margin:28px auto;padding:0 16px}
.card{background:white;border-radius:18px;padding:22px;box-shadow:0 8px 30px #0000000d;margin-bottom:18px}
label{display:block;font-weight:700;margin:14px 0 8px}
textarea,select{width:100%;padding:13px;border:1px solid #d6dbe5;border-radius:10px;font-size:16px}
textarea{min-height:120px;resize:vertical}
button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:10px;background:#2563eb;color:white;font-size:16px;font-weight:700;cursor:pointer}
button:hover{opacity:.92}
#result{white-space:pre-wrap;line-height:1.6;background:#f8fafc;border-radius:12px;padding:16px;min-height:80px}
.small{font-size:13px;color:#64748b}
</style>
</head>
<body>
<header>
  <h1>🚀 BizAI</h1>
  <p>Seu assistente para criar conteúdo para o seu negócio</p>
</header>

<main>
  <section class="card">
    <h2>Crie conteúdo em segundos</h2>
    <p class="small">Esta é a primeira versão de demonstração. Ela funciona sem configurar uma API.</p>

    <label for="business">O que você vende?</label>
    <textarea id="business" placeholder="Ex.: roupas masculinas, bolos, acessórios para celular..."></textarea>

    <label for="goal">O que você quer criar?</label>
    <select id="goal">
      <option value="anuncio">Anúncio para vender</option>
      <option value="post">Post para redes sociais</option>
      <option value="descricao">Descrição do produto</option>
      <option value="cliente">Resposta para cliente</option>
    </select>

    <button onclick="generate()">✨ Gerar conteúdo</button>
  </section>

  <section class="card">
    <h2>Resultado</h2>
    <div id="result">O seu conteúdo aparecerá aqui.</div>
    <button onclick="copyResult()">📋 Copiar resultado</button>
  </section>
</main>

<script>
function generate(){
  const business=document.getElementById('business').value.trim();
  const goal=document.getElementById('goal').value;
  const result=document.getElementById('result');
  if(!business){result.textContent='Escreva primeiro o que você vende.';return;}

  const texts={
    anuncio:`🔥 ATENÇÃO!\n\nEstá procurando ${business} com qualidade e bom preço?\n\nTemos opções pensadas para você. Aproveite e faça já o seu pedido!\n\n📲 Envie uma mensagem para saber mais.\n\n#Promoção #Negócio #Ofertas`,
    post:`✨ Novidade para você!\n\nSe você procura ${business}, esta pode ser a oportunidade que estava esperando.\n\nQualidade, atenção ao cliente e uma experiência simples para comprar.\n\n📲 Fale conosco e saiba mais!`,
    descricao:`🛍️ ${business}\n\nUma opção prática para quem procura qualidade e bom atendimento.\n\n✅ Produto/serviço pensado para as necessidades do cliente\n✅ Atendimento rápido\n✅ Pedido simples\n\n📲 Entre em contacto para conhecer os detalhes.`,
    cliente:`Olá! 😊 Obrigado pelo seu interesse em ${business}.\n\nSerá um prazer ajudar. Posso enviar os detalhes, preço e disponibilidade para você.`
  };
  result.textContent=texts[goal];
}
function copyResult(){
  const text=document.getElementById('result').textContent;
  navigator.clipboard?.writeText(text);
}
</script>
</body>
</html>
